name: GitHub Pages and scheduled Cloudflare refresh

on:
  push:
    branches: [main]
  schedule:
    - cron: '17 4 * * *' # daily, so the endoflife.date snapshot stays fresh
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.22.1
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Build GitHub Pages site
        run: npm run build # fetches endoflife.date, then builds
        env:
          ASTRO_BASE_PATH: ${{ vars.GITHUB_PAGES_BASE_PATH || '/eol-check/' }}
      - run: npm run check
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  refresh-cloudflare:
    if: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      CLOUDFLARE_BUILD_HOOK_URL: ${{ secrets.CLOUDFLARE_BUILD_HOOK_URL }}
    steps:
      - name: Trigger Cloudflare Workers Build
        if: ${{ env.CLOUDFLARE_BUILD_HOOK_URL != '' }}
        run: |
          curl --fail --silent --show-error --request POST "$CLOUDFLARE_BUILD_HOOK_URL" |
            jq --exit-status '.success == true'
      - name: Explain missing optional build hook
        if: ${{ env.CLOUDFLARE_BUILD_HOOK_URL == '' }}
        run: echo '::notice::Set CLOUDFLARE_BUILD_HOOK_URL to refresh Cloudflare data on scheduled runs. Push deployments are managed by Cloudflare Git integration.'
